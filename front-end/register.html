<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AeroX Crash</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/register.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="index.html"><span class="brand-mark">✈</span> AeroX Crash</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
      </div>
    </nav>

    <main class="auth-shell">
      <form class="auth-card" id="registerForm">
        <h1>Create account</h1>
        <p>Join the live aviation challenge and manage your profile.</p>
        <p id="registerMessage" class="auth-message"></p>
        <label>
          Full name
          <input type="text" name="name" placeholder="Ava Pilot" required />
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" required />
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Create a strong password" required />
        </label>
        <button class="btn primary" type="submit">Register</button>
        <p class="form-note">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </main>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>

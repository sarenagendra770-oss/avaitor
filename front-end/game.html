<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game | AeroX Crash</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="index.html"><span class="brand-mark">✈</span> AeroX Crash</a>
      <div class="nav-links">
        <a href="lobby.html">Lobby</a>
        <a href="wallet.html">Wallet</a>
      </div>
    </nav>

    <main class="game-shell">
      <section class="game-panel">
        <div class="game-toolbar">
          <div class="stat-chip">
            <span>Balance</span>
            <strong id="balanceValue">$12,480.00</strong>
          </div>
          <div class="stat-chip">
            <span>Round</span>
            <strong id="roundNumber">#4823</strong>
          </div>
          <div class="stat-chip">
            <span>Multiplier</span>
            <strong id="multiplierValue">1.00x</strong>
          </div>
        </div>

        <div class="game-stage">
          <canvas id="gameCanvas" width="960" height="540"></canvas>
          <div class="overlay">
            <span class="status-pill" id="roundStatus">Ready to launch</span>
            <div class="multiplier-badge">
              <span>Current</span>
              <strong id="overlayMultiplier">1.00x</strong>
            </div>
          </div>
        </div>

        <div class="controls">
          <label class="bet-field">
            <span>Bet</span>
            <input id="betAmount" type="number" min="1" step="1" value="20" />
          </label>
          <button class="btn primary" id="startRound">Launch Flight</button>
          <button class="btn secondary" id="cashOut">Cash Out</button>
        </div>
      </section>

      <aside class="game-sidebar">
        <section class="sidebar-card">
          <h2>Round Details</h2>
          <div class="detail-row"><span>Payout</span><strong id="payoutValue">$0.00</strong></div>
          <div class="detail-row"><span>Crash Point</span><strong id="crashValue">--</strong></div>
          <div class="detail-row"><span>Status</span><strong id="statusValue">Waiting</strong></div>
        </section>

        <section class="sidebar-card">
          <h2>Live Bets</h2>
          <div class="bet-item"><strong>NovaPilot</strong><span>$24 • 2.8x</span></div>
          <div class="bet-item"><strong>SkyRacer</strong><span>$16 • 1.9x</span></div>
          <div class="bet-item"><strong>CloudMancer</strong><span>$32 • 3.3x</span></div>
        </section>
      </aside>
    </main>

    <script src="js/app.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
